# Fallback static-AP config for stock wpa_supplicant (used only if ConnMan tethering fails).
# Owner's own car. CHANGE ssid/psk.
ctrl_interface=/var/run/wpa_supplicant
ap_scan=2
network={
    ssid="IONIQ5-OWNER"
    mode=2
    frequency=2437
    key_mgmt=WPA-PSK
    proto=RSN
    pairwise=CCMP
    psk="ChangeMe-OwnerPSK"
}
